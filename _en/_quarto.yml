# English project. Renders to ../_site/en/
# Shared assets (styles.scss, publications.bib, images/) live in the repo
# root and are NOT duplicated here — see CLAUDE.md.
project:
  type: website
  output-dir: ../_site/en

website:
  title: "DOTS Lab"
  site-url: "https://dotsresearch.github.io/en"
  repo-url: "https://github.com/dotsresearch/dotsresearch.github.io"
  navbar:
    title: "DOTS Lab"
    background: dark
    left:
      - href: index.qmd
        text: "Home"
      - href: research.qmd
        text: "Research"
      - href: people.qmd
        text: "People"
      - href: publications.qmd
        text: "Publications"
    right:
      # Language toggle back to the Chinese site. MUST be ../ and not / —
      # Quarto resolves / against THIS project's root (/en/), so a plain /
      # would link the English site back to itself. See CLAUDE.md.
      - href: ../
        text: "中文"
  page-footer:
    left: "© 2026 DOTS Lab · Chinese Culture University"
    right: "Dynamics and Observations: Tropopause and Satellites"

lang: en

format:
  html:
    theme: [cosmo, ../styles.scss]
    toc: false
